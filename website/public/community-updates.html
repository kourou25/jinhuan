<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社区更新 · 尽欢</title>
  <script>
    const query = new URLSearchParams(location.search)
    const next = new URLSearchParams({ tab: 'updates' })
    for (const key of ['kind', 'issue']) {
      if (query.has(key)) next.set(key, query.get(key))
    }
    location.replace('/road?' + next + location.hash)
  </script>
</head>
<body>
  <p>社区更新已移到社区共建。<a href="/road?tab=updates">查看社区更新</a></p>
</body>
</html>
